services:
  - type: web
    name: konversiku
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 1800 app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: KONVERSIKU_REQUIRE_AUTH
        value: "true"
      - key: KONVERSIKU_ACCESS_CODE
        sync: false
